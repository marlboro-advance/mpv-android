name: release

on:
  push:
    tags:
      - '*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Get tag name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_TAG="v1.0.0"
          fi
          echo "VERSION_TAG=$RAW_TAG" >> $GITHUB_ENV
          echo "MAVEN_VERSION=${RAW_TAG#v}" >> $GITHUB_ENV

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build python3-pip nasm gperf zip curl
          sudo pip3 install meson

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch armv7l mpv
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh --arch x86 mpv
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh
        env:
          GRADLE_OPTS: -Xmx4G

      - name: Publish and Upload to Maven Central Portal
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -e
          ./gradlew :app:publishReleasePublicationToBuildDirRepository
          cd app/build/repo
          zip -r ../central-bundle.zip .
          cd ../../..
          TOKEN=$(printf "%s:%s" "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w 0)
          echo "Uploading bundle to Sonatype Central Portal..."
          curl --fail-with-body -X POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@app/build/central-bundle.zip"

      - name: Copy build artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          mv app/build/outputs/aar/app-release.aar mpv-android-lib-${{ env.VERSION_TAG }}.aar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpv-android-lib ${{ env.VERSION_TAG }}
          body: |
            ### mpv-android-lib ${{ env.VERSION_TAG }}

            #### Maven Central Coordinates
            ```gradle
            implementation("io.github.marlboro-advance:mpv-android:${{ env.MAVEN_VERSION }}")
            ```

            Includes all native ABIs (`arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`) with libmpv and Vulkan support.
          files: |
            mpv-android-lib-${{ env.VERSION_TAG }}.aar
          draft: false
          prerelease: false
