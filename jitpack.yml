jdk:
  - openjdk17

install:
  - |
    TAG="${VERSION:-$GIT_TAG}"
    echo "Preparing native libraries for tag: $TAG"
    URL="https://github.com/marlboro-advance/mpv-android/releases/download/${TAG}/mpv-android-lib-${TAG}.aar"
    mkdir -p app/src/main/libs
    echo "Checking for GitHub release AAR at: $URL"
    if wget -q --spider "$URL"; then
      echo "Release AAR found! Downloading and extracting native .so libraries..."
      wget -q "$URL" -O /tmp/release.aar
      unzip -q -o /tmp/release.aar "jni/*" -d app/src/main/libs/ || true
      if [ -d "app/src/main/libs/jni" ]; then
        cp -rn app/src/main/libs/jni/* app/src/main/libs/ || true
        rm -rf app/src/main/libs/jni
      fi
      echo "Native libraries successfully placed in app/src/main/libs:"
      find app/src/main/libs -name "*.so"
    else
      echo "Release AAR not found at $URL. Building Java/Kotlin components only."
    fi
  - ./gradlew publishToMavenLocal -PGROUP=com.github.marlboro-advance -PVERSION=${VERSION:-$GIT_TAG} -x test

artifacts:
  - app/build/outputs/aar/*.aar
